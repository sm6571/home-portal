<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <script>(function(){var t=localStorage.getItem('portal-theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.setAttribute('data-bs-theme',t);})()</script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <h1>🏠 Home Portal</h1>
    <div class="actions">
      <span class="text-muted small" id="navUser"></span>
      <button class="btn-icon" onclick="toggleTheme()" title="Toggle theme">🌓</button>
      <button class="btn-icon" onclick="logout()" title="Logout">🚪</button>
    </div>
  </nav>

  <div class="greeting" id="greeting"></div>

  <div class="app-grid" id="appGrid">
    <!-- Apps loaded here -->
  </div>

  <!-- Add App Modal -->
  <div class="modal fade" id="addAppModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header border-0">
          <h5 class="modal-title" id="appModalTitle">Add App</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editAppId">
          <div class="mb-3"><label class="form-label">Name</label><input type="text" class="form-control" id="appName" placeholder="My App"></div>
          <div class="mb-3"><label class="form-label">URL</label><input type="url" class="form-control" id="appUrl" placeholder="http://localhost:8080"></div>
          <div class="mb-3"><label class="form-label">Description</label><input type="text" class="form-control" id="appDesc" placeholder="What does this app do?"></div>
          <div class="row g-3">
            <div class="col-6"><label class="form-label">Icon (emoji)</label><input type="text" class="form-control" id="appIcon" placeholder="📦" maxlength="4"></div>
            <div class="col-6"><label class="form-label">Color</label><input type="color" class="form-control form-control-color w-100" id="appColor" value="#6366f1"></div>
          </div>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-outline-danger" id="deleteAppBtn" onclick="deleteApp()" style="display:none;">Delete</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-accent" onclick="saveApp()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body></html>
